<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>EDEN - Luxury Clothing</title>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">EDEN</a>
            </div>
            <div class="nav-links">
                <a href="#collections">Collections</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Timeless Elegance</h1>
            <p>Crafting Luxury Since 2023</p>
            <button class="cta-button">Explore Collection</button>
        </div>
    </section>

    <section class="products" id="collections">
        <h2>New Arrivals</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://invitadisima.com/97357-large_default/long-evening-gown-in-emerald-green-satin-with-embellished-neckline-and-maxi-bow-skirt.jpg" alt="Luxury Dress">
                <h3>Silk Evening Gown</h3>
                <p>$1,850</p>
            </div>
            <div class="product-card">
                <img src="https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-1339431_alternate1?$rl_4x5_pdp$" alt="Tailored Suit">
                <h3>Tailored Wool Suit</h3>
                <p>$2,450</p>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?ixlib=rb-1.2.1&auto=format&fit=crop&w=634&q=80" alt="Cashmere Coat">
                <h3>Cashmere Trench Coat</h3>
                <p>$3,200</p>
            </div>
        </div>
    </section>

    <footer>
        <p>EDEN © 2023</p>
        <p>Contact: contact@edenluxury.com</p>
        <p>Paris | Milan | New York</p>
    </footer>
</body>
</html>
